name: GPU Heat Diffusion CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workspace:
    name: Workspace & Code Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Notebook JSON Integrity
        run: |
          python -c "
          import json, os
          assert os.path.exists('G25ait2026_final.ipynb'), 'Missing notebook file'
          with open('G25ait2026_final.ipynb', 'r', encoding='utf-8') as f:
              nb = json.load(f)
          print('Notebook parsed successfully. Total cells:', len(nb.get('cells', [])))
          "

      - name: Check Required Files
        run: |
          for f in Dockerfile Makefile .dockerignore heat2d.cu gmg.cu README.md; do
            if [ ! -f "$f" ]; then
              echo "Error: Required file $f is missing" && exit 1
            fi
            echo "Found $f"
          done

  docker-build-and-verify:
    name: Build Multi-GPU Container & Compile Solvers
    runs-on: ubuntu-latest
    needs: validate-workspace
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CUDA Docker Image
        run: |
          echo "Building Docker image with nvcc compiling for sm_75, sm_80, sm_86, sm_89, sm_90..."
          docker build -t gpu-heat-diffusion:latest .

      - name: Test Container Initialization & Binary Verification
        run: |
          echo "Verifying GMG solver inside container..."
          docker run --rm gpu-heat-diffusion:latest ./gmg -h || true
          docker run --rm gpu-heat-diffusion:latest ./gmg -n 65 -e 1e-4

          echo "Verifying JOR / RB-SOR solver inside container..."
          docker run --rm gpu-heat-diffusion:latest ./heat2d -h || true
          docker run --rm gpu-heat-diffusion:latest ./heat2d -n 37 -e 1e-4

      - name: Generate Rendered Notebook HTML Report
        run: |
          echo "Rendering standalone HTML report from notebook..."
          docker run --name reporter gpu-heat-diffusion:latest \
            jupyter nbconvert --to html G25ait2026_final.ipynb --output report.html
          docker cp reporter:/workspace/report.html ./rendered_notebook.html
          docker rm reporter
          echo "Notebook successfully rendered to HTML."

      - name: Extract Compiled CUDA Binaries and Package Artifacts
        run: |
          echo "Extracting compiled Linux binaries from Docker container..."
          mkdir -p dist/bin dist/reports dist/docs
          
          CONTAINER_ID=$(docker create gpu-heat-diffusion:latest)
          docker cp $CONTAINER_ID:/workspace/heat2d dist/bin/heat2d
          docker cp $CONTAINER_ID:/workspace/gmg dist/bin/gmg
          docker rm $CONTAINER_ID

          # Move rendered report
          cp rendered_notebook.html dist/reports/G25ait2026_interactive_report.html

          # Include PDF report and README if available
          [ -f "G25ait2026_IEEE_report_final.pdf" ] && cp "G25ait2026_IEEE_report_final.pdf" dist/docs/ || true
          [ -f "README.md" ] && cp "README.md" dist/ || true

          # Generate Build Manifest
          cat <<EOF > dist/BUILD_INFO.txt
          =======================================================
          GPU-Accelerated 2D Heat Diffusion Solver - Build Info
          =======================================================
          Commit SHA    : ${{ github.sha }}
          Branch        : ${{ github.ref_name }}
          Built By      : GitHub Actions
          CUDA Toolchain: CUDA 12.6.3 (nvcc -O3 -std=c++17 -lineinfo)
          GPU Targets   : sm_75 (T4), sm_80 (A100), sm_86 (RTX 30xx),
                          sm_89 (RTX 40xx), sm_90 (H100), compute_75 (PTX)
          Artifacts     :
            - dist/bin/heat2d (JOR & RB-SOR solver binary)
            - dist/bin/gmg (Geometric Multigrid solver binary)
            - dist/reports/G25ait2026_interactive_report.html
            - dist/docs/G25ait2026_IEEE_report_final.pdf
          =======================================================
          EOF

          echo "Artifact structure prepared:"
          ls -laR dist/

      - name: Upload Artifacts (Downloadable ZIP via GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: gpu-heat-diffusion-artifacts
          path: dist/
          retention-days: 30
          if-no-files-found: error
